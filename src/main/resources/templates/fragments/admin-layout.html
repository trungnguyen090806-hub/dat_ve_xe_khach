<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ========== HEAD admin ========== -->
<head th:fragment="adminHead(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | BusGo Admin'">BusGo Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/main.css}" rel="stylesheet">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>

<body>

<!-- ========== SIDEBAR: tham so active = dashboard|trips|companies|customers|tickets|seats|payments|promotions|reports ========== -->
<aside th:fragment="sidebar(active)" class="admin-sidebar" id="adminSidebar">
    <a th:href="@{/admin/dashboard}" class="sidebar-brand">
        <i class="bi bi-bus-front-fill text-accent me-2"></i>Bus<span class="text-accent">Go</span>
        <small class="d-block text-white-50 fw-normal">Quản trị hệ thống</small>
    </a>
    <ul class="sidebar-menu">
        <li><a th:href="@{/admin/dashboard}" th:classappend="${active == 'dashboard'} ? 'active'"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
        <li><a th:href="@{/admin/trips}" th:classappend="${active == 'trips'} ? 'active'"><i class="bi bi-signpost-split"></i>Quản lý chuyến xe</a></li>
        <li><a th:href="@{/admin/companies}" th:classappend="${active == 'companies'} ? 'active'"><i class="bi bi-building"></i>Quản lý nhà xe</a></li>
        <li><a th:href="@{/admin/customers}" th:classappend="${active == 'customers'} ? 'active'"><i class="bi bi-people"></i>Quản lý khách hàng</a></li>
        <li><a th:href="@{/admin/tickets}" th:classappend="${active == 'tickets'} ? 'active'"><i class="bi bi-ticket-perforated"></i>Quản lý vé</a></li>
        <li><a th:href="@{/admin/seats}" th:classappend="${active == 'seats'} ? 'active'"><i class="bi bi-grid-3x3-gap"></i>Quản lý ghế</a></li>
        <li><a th:href="@{/admin/payments}" th:classappend="${active == 'payments'} ? 'active'"><i class="bi bi-credit-card"></i>Quản lý thanh toán</a></li>
        <li><a th:href="@{/admin/promotions}" th:classappend="${active == 'promotions'} ? 'active'"><i class="bi bi-percent"></i>Quản lý khuyến mãi</a></li>
        <li><a th:href="@{/admin/reports}" th:classappend="${active == 'reports'} ? 'active'"><i class="bi bi-graph-up-arrow"></i>Báo cáo doanh thu</a></li>
        <li>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="logout-btn"><i class="bi bi-box-arrow-right"></i>Đăng xuất</button>
            </form>
        </li>
    </ul>
</aside>

<!-- ========== TOPBAR ========== -->
<div th:fragment="topbar(title)" class="admin-topbar">
    <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none" type="button" id="sidebarToggle"><i class="bi bi-list fs-5"></i></button>
        <h4 class="mb-0 fw-bold text-primary-dark" th:text="${title}">Tiêu đề</h4>
    </div>
    <div class="d-flex align-items-center gap-3">
        <a th:href="@{/}" class="btn btn-outline-primary btn-sm d-none d-md-inline-block"><i class="bi bi-box-arrow-up-right me-1"></i>Xem website</a>
        <span class="text-muted"><i class="bi bi-person-circle me-1"></i><span sec:authentication="name">Admin</span></span>
    </div>
</div>

<!-- ========== PHAN TRANG (giu keyword + status khi chuyen trang) ========== -->
<nav th:fragment="pagination(page, url, keyword, status)" th:if="${page.totalPages > 1}">
    <ul class="pagination pagination-sm mb-0 justify-content-end">
        <li class="page-item" th:classappend="${page.first} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number - 1}, keyword=${keyword}, status=${status})}">&laquo;</a></li>
        <li class="page-item" th:each="i : ${#numbers.sequence(0, page.totalPages - 1)}"
            th:classappend="${i == page.number} ? 'active'">
            <a class="page-link" th:href="@{${url}(page=${i}, keyword=${keyword}, status=${status})}" th:text="${i + 1}">1</a></li>
        <li class="page-item" th:classappend="${page.last} ? 'disabled'">
            <a class="page-link" th:href="@{${url}(page=${page.number + 1}, keyword=${keyword}, status=${status})}">&raquo;</a></li>
    </ul>
</nav>

<!-- ========== MODAL XAC NHAN DUNG CHUNG (xoa / huy) ========== -->
<div th:fragment="confirmModal" class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <form class="modal-content" method="post" th:action="@{/admin/placeholder}" id="confirmForm">
            <div class="modal-header">
                <h5 class="modal-title" id="confirmTitle">Xác nhận</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="confirmMessage">Bạn chắc chắn?</div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Đóng</button>
                <button type="submit" class="btn btn-danger" id="confirmBtn">Xác nhận</button>
            </div>
        </form>
    </div>
</div>

<!-- ========== SCRIPTS ========== -->
<th:block th:fragment="adminScripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/main.js}"></script>
    <script th:src="@{/js/admin.js}"></script>
</th:block>

</body>
</html>
