<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu')}"></head>
<body class="bg-page">
<header th:replace="~{fragments/layout :: header}"></header>

<main class="container auth-wrapper">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card auth-card">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="auth-icon"><i class="bi bi-envelope-at"></i></div>
                        <h3 class="fw-bold text-primary-dark mb-1">Quên mật khẩu</h3>
                        <p class="text-muted mb-0">Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>
                    </div>
                    <div class="alert alert-info small">
                        <i class="bi bi-info-circle me-1"></i>Môi trường DEMO: hệ thống chưa gửi email thật.</div>
                    <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post" novalidate>
                        <div class="mb-4">
                            <label class="form-label" for="email">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:errorclass="is-invalid" placeholder="ban@email.com">
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary-brand w-100 py-2">Gửi yêu cầu</button>
                    </form>
                    <p class="text-center mt-4 mb-0"><a th:href="@{/login}"><i class="bi bi-arrow-left"></i> Quay lại đăng nhập</a></p>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: toasts}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
