<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: adminHead('Quản lý nhà xe')}"></head>
<body class="admin-body">
<div class="admin-wrapper">
    <aside th:replace="~{fragments/admin-layout :: sidebar('companies')}"></aside>

    <div class="admin-main">
        <div th:replace="~{fragments/admin-layout :: topbar('Quản lý nhà xe')}"></div>

        <main class="admin-content">
            <div class="card mb-3">
                <div class="card-body">
                    <form method="get" th:action="@{/admin/companies}" class="row g-2 align-items-end">
                        <div class="col-md-5">
                            <label class="form-label">Tìm kiếm</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-search"></i></span>
                                <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                                       placeholder="Tên nhà xe, hotline, địa chỉ...">
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label">Trạng thái</label>
                            <select name="status" class="form-select">
                                <option value="">Tất cả</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                                        th:selected="${s.name() == statusParam}"></option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex gap-2">
                            <button class="btn btn-primary-brand"><i class="bi bi-funnel me-1"></i>Lọc</button>
                            <a th:href="@{/admin/companies}" class="btn btn-light">Xóa lọc</a>
                            <button type="button" class="btn btn-accent ms-auto" data-bs-toggle="modal"
                                    data-bs-target="#companyModal" data-mode="add">
                                <i class="bi bi-plus-lg me-1"></i>Thêm nhà xe</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card table-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>Nhà xe</th><th>Hotline</th><th>Địa chỉ</th><th>Đánh giá</th>
                            <th class="text-center">Xe</th><th class="text-center">Chuyến</th>
                            <th>Trạng thái</th><th class="text-end">Thao tác</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="c : ${page.content}">
                            <td><a class="fw-semibold" th:href="@{/admin/companies/{id}(id=${c.id})}" th:text="${c.name}">Nhà xe</a></td>
                            <td th:text="${c.hotline}">1900 0000</td>
                            <td class="small" th:text="${c.address}">Địa chỉ</td>
                            <td><i class="bi bi-star-fill text-warning"></i>
                                <strong th:text="${c.ratingAvg}">4.5</strong>
                                <small class="text-muted" th:text="'(' + ${c.ratingCount} + ')'">(100)</small></td>
                            <td class="text-center" th:text="${c.busCount}">0</td>
                            <td class="text-center" th:text="${c.tripCount}">0</td>
                            <td><span class="badge-soft" th:text="${c.statusLabel}"
                                      th:classappend="${c.status == 'ACTIVE'} ? 'badge-soft-success' : 'badge-soft-secondary'">Hoạt động</span></td>
                            <td class="text-end text-nowrap">
                                <a th:href="@{/admin/companies/{id}(id=${c.id})}" class="btn btn-sm btn-outline-secondary btn-icon" title="Chi tiết: xe &amp; chuyến">
                                    <i class="bi bi-eye"></i></a>
                                <button type="button" class="btn btn-sm btn-outline-primary btn-icon" title="Sửa"
                                        data-bs-toggle="modal" data-bs-target="#companyModal" data-mode="edit"
                                        th:data-id="${c.id}" th:data-name="${c.name}" th:data-hotline="${c.hotline}"
                                        th:data-email="${c.email}" th:data-address="${c.address}"
                                        th:data-description="${c.description}" th:data-status="${c.status}">
                                    <i class="bi bi-pencil"></i></button>
                                <button type="button" class="btn btn-sm btn-outline-danger btn-icon" title="Xóa"
                                        data-bs-toggle="modal" data-bs-target="#confirmModal"
                                        th:data-confirm-action="@{/admin/companies/{id}/delete(id=${c.id})}"
                                        data-confirm-title="Xóa nhà xe"
                                        th:data-confirm-message="'Xóa nhà xe ' + ${c.name} + '? (Chỉ xóa được khi nhà xe chưa có xe nào)'"
                                        data-confirm-button="Xóa" data-confirm-class="btn-danger">
                                    <i class="bi bi-trash"></i></button>
                            </td>
                        </tr>
                        <tr th:if="${page.empty}">
                            <td colspan="8" class="text-center text-muted py-5">
                                <i class="bi bi-inbox fs-1 d-block"></i>Không có nhà xe nào.</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="card-footer bg-white d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
                    <small class="text-muted">Tổng <strong th:text="${page.totalElements}">0</strong> nhà xe</small>
                    <div th:replace="~{fragments/admin-layout :: pagination(${page}, '/admin/companies', ${keyword}, ${statusParam})}"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Modal them / sua nha xe -->
<div class="modal fade" id="companyModal" tabindex="-1" data-crud-modal data-add-title="Thêm nhà xe" data-edit-title="Sửa nhà xe">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <form class="modal-content" method="post" th:action="@{/admin/companies/save}">
            <div class="modal-header">
                <h5 class="modal-title">Thêm nhà xe</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="id">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Tên nhà xe *</label>
                        <input type="text" name="name" class="form-control" required maxlength="120">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Hotline *</label>
                        <input type="text" name="hotline" class="form-control" required maxlength="20" placeholder="1900 6868">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" maxlength="120">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Trạng thái *</label>
                        <select name="status" class="form-select">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                        </select>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Địa chỉ *</label>
                        <input type="text" name="address" class="form-control" required maxlength="255">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Mô tả</label>
                        <textarea name="description" class="form-control" rows="3" maxlength="2000"></textarea>
                    </div>
                </div>
                <div class="form-text mt-2"><i class="bi bi-star"></i> Điểm đánh giá được tính tự động từ đánh giá của khách hàng.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-light" data-bs-dismiss="modal">Đóng</button>
                <button type="submit" class="btn btn-primary-brand"><i class="bi bi-check2 me-1"></i>Lưu</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="~{fragments/admin-layout :: confirmModal}"></div>
<div th:replace="~{fragments/layout :: toasts}"></div>
<th:block th:replace="~{fragments/admin-layout :: adminScripts}"></th:block>
</body>
</html>
