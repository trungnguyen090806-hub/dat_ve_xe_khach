spring.application.name=bus-ticket-booking
server.port=8080

# ---- MySQL 8 (sua username/password cho dung may cua ban) ----
spring.datasource.url=jdbc:mysql://localhost:3306/bus_ticket_booking?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate: schema do file SQL quan ly, KHONG de Hibernate tu sua ----
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---- Thymeleaf ----
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# ---- Upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload-dir=src/main/resources/static/uploads

# ---- Nghiep vu ----
app.booking.hold-minutes=10
app.booking.hold-cleanup-rate-ms=60000
app.payment.demo-mode=true

# ---- Tieng Viet ----
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.messages.encoding=UTF-8
